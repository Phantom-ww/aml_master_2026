version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aml_postgres
    environment:
      POSTGRES_DB: aml_investigations
      POSTGRES_USER: aml_user
      POSTGRES_PASSWORD: aml_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aml_user -d aml_investigations"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aml_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aml_user:aml_password@db:5432/aml_investigations
      PYTHONUNBUFFERED: 1
      ESPLORA_URL: https://mempool.space/api
      ESPLORA_FALLBACK_URL: https://blockstream.info/api
      BTC_NETWORK: mainnet
      HTTP_TIMEOUT: 120
      MAX_RETRIES: 5
      MAX_CONCURRENT_REQUESTS: 2
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aml_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    command: npm run dev -- --host

volumes:
  postgres_data:
